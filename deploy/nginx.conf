# Example nginx config for Scribble. Replace scribble.example.com and the
# certificate paths. Place in conf.d/ (the limit_req_zone lines are http-level).

limit_req_zone $binary_remote_addr zone=scribble_login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name scribble.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen ... http2` works on every nginx; the newer `http2 on;` directive
    # needs nginx >= 1.25.1 (Debian 12 ships 1.22). On new nginx the listen
    # form only logs a deprecation warning.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scribble.example.com;

    ssl_certificate     /etc/letsencrypt/live/scribble.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scribble.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # A sketch is 2400 bytes plus a handle line; 16k is plenty.
    client_max_body_size 16k;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    # OVERWRITE (never $proxy_add_x_forwarded_for, which appends to a client-
    # supplied header): uvicorn trusts X-Forwarded-For from us, and the app's
    # per-IP login rate limiter keys on it, so a client must not be able to forge it.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout    15s;
    proxy_read_timeout    30s;
    send_timeout          30s;
    client_body_timeout   15s;
    client_header_timeout 15s;
    keepalive_timeout     30s;

    # The Palm treats any non-200 reply as a bad reply and cannot read its
    # body, so a rate-limited Palm login gets HTTP 200 with the app's usual
    # error line instead of nginx's 429 page.
    location = /palm/v1/login {
        limit_req zone=scribble_login burst=5 nodelay;
        error_page 429 = @palm_too_many;
        proxy_pass http://127.0.0.1:8000;
    }
    location @palm_too_many {
        default_type text/plain;
        return 200 "err too many attempts\n";
    }
    location = /api/login {
        limit_req zone=scribble_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /api/signup {
        limit_req zone=scribble_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
